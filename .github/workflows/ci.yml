name: ci

# No dataset download and no model training. The tests run on synthetic
# frames; the artifact checks run on what is committed:
#   * the two group predictions per split re-derive FINAL_*.npy bit for bit;
#   * results/official/labels_valid_test.npz (140 KB of user_id + long_view)
#     rescores those predictions with the untouched starter-kit evaluator and
#     holds GAUC / nDCG@5 / primary against final.json to 5e-7, so this badge
#     covers the headline test 0.6015, not only the blend arithmetic;
#   * ceiling.json (the attainable range the README quotes) is recomputed
#     from the same committed labels;
#   * the run log and its rendered table are recompiled and diffed;
#   * tests/test_readme_numbers.py holds the README's numbers to the artifacts.
# Windows runs too, because the results were produced on Windows.
# The labels themselves are re-derived from the md5-pinned public download by
# the separate labels.yml workflow.

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the CPU wheel of torch, then the pinned requirements
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Tests (synthetic data only)
        run: python -m pytest tests
      - name: Final submission re-derives and rescores to final.json
        run: python scripts/official_final.py --check
      - name: Attainable range recomputes to ceiling.json
        run: python scripts/official_ceiling.py --check
      - name: Run log is what the result artifacts compile to
        run: python scripts/official_runlog.py --check
      - name: RUN_LOG.md is what the run log renders to
        run: python scripts/official_runlog_md.py --check
