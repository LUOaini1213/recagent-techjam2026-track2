name: labels

# The committed labels (results/official/labels_valid_test.npz) are what lets
# ci.yml rescore the headline offline. This workflow closes the loop back to
# the source: it downloads KuaiRand-Pure from Zenodo against the md5 pinned in
# scripts/download_kuairand.py, re-derives the (user_id, long_view) columns of
# the valid and test splits from the raw logs, and fails if a single byte
# differs from the committed npz. The last step then rescores the committed
# predictions against final.json with that npz - which the step before it has
# just shown to be the public data.
#
# It is kept out of ci.yml on purpose: a Zenodo outage should not turn the
# badge red, and the check does not depend on the commit being tested.

on:
  workflow_dispatch:
  # Also on pull requests that touch what this workflow verifies, so the
  # source-to-labels check is exercised before such a change merges. The
  # README badge is ci.yml, so a Zenodo outage here never turns it red.
  pull_request:
    paths:
      - results/official/labels_valid_test.npz
      - scripts/official_labels.py
      - scripts/download_kuairand.py
      - .github/workflows/labels.yml
  schedule:
    # 03:17 UTC on the 1st of each month.
    - cron: "17 3 1 * *"

jobs:
  labels-from-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy/pandas/pyarrow at the bounds in requirements.txt
        run: pip install "numpy>=1.24,<3" "pandas>=2.0,<3" "pyarrow>=14"
      - name: Download KuaiRand-Pure from Zenodo (md5-pinned)
        run: python scripts/download_kuairand.py
      - name: Committed labels equal the ones derived from the public release
        run: python scripts/official_labels.py --check
      - name: And those labels rescore the submission to final.json
        run: python scripts/official_final.py --check
